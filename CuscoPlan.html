<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CuscoPlan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#E8EBE2;--card:#F6F5EF;--ink:#26301F;--mut:#5C6553;--g:#2F5233;--gl:#DCE6D4;--e:#7B4F2C;--el:#EADCCB;--o:#B98A2E;--line:#CBD1C0;--sky1:#CFD9C1;--sky2:#EAD9B8;--m1:#A9BC9A;--m2:#5F8A5B;--m3:#3F6B43;--t:#C9A868;--r:#8A6A45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A2016;--card:#242C1F;--ink:#ECEFE4;--mut:#A9B39D;--g:#8FBF8A;--gl:#2E3B29;--e:#D2A06E;--el:#3A2E22;--o:#D9AE55;--line:#3A4433;--sky1:#141B12;--sky2:#2A2418;--m1:#2B3A28;--m2:#33513A;--m3:#263D28;--t:#6E5A34;--r:#5A4530}}
:root[data-theme="dark"]{--bg:#1A2016;--card:#242C1F;--ink:#ECEFE4;--mut:#A9B39D;--g:#8FBF8A;--gl:#2E3B29;--e:#D2A06E;--el:#3A2E22;--o:#D9AE55;--line:#3A4433;--sky1:#141B12;--sky2:#2A2418;--m1:#2B3A28;--m2:#33513A;--m3:#263D28;--t:#6E5A34;--r:#5A4530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}body{margin:0;background:transparent;color:var(--ink);font:16px/1.55 'Nunito Sans',system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:'Young Serif',Georgia,serif;font-weight:400;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font:400 22px 'Young Serif',Georgia,serif;color:var(--g)}
.lang{display:flex;border:1.5px solid var(--g);border-radius:99px;overflow:hidden}
.lang button{border:0;background:none;color:var(--g);font:700 13px inherit;padding:7px 14px;cursor:pointer}
.lang button.on{background:var(--g);color:var(--bg)}
.hero{background:var(--g);color:#F1F4E8;border-radius:22px;padding:22px 20px 0;overflow:hidden}
.hero h1{font-size:28px;line-height:1.15}
.hero p{margin:10px 0 0;opacity:.92}
.hero svg{display:block;width:100%;height:auto;margin-top:8px}
.box{background:color-mix(in srgb,var(--card) 93%,transparent);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
h2{font-size:20px;margin-bottom:12px}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.days button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 0;font:700 17px inherit;cursor:pointer}
.days button.on{background:var(--e);border-color:var(--e);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:9px 15px;font:600 15px inherit;cursor:pointer}
.chips button.on{background:var(--gl);border-color:var(--g);color:var(--g)}
.lbl{font-weight:700;margin:0 0 8px}
.lbl+.days,.lbl+.chips{margin-bottom:16px}
.cta{width:100%;border:0;background:var(--o);color:#1E1A0E;font:700 17px inherit;padding:15px;border-radius:14px;cursor:pointer;margin-top:4px}
.cta.wa{background:#1F7A45;color:#fff;display:flex;justify-content:center;gap:8px;align-items:center}
button:focus-visible,summary:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.day{border-left:4px solid var(--g);background:color-mix(in srgb,var(--card) 93%,transparent);border-radius:0 16px 16px 0;padding:14px 16px;margin-top:12px}
.day.easy{border-color:var(--o)}
.dh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.dh h3{font-size:18px}
.alt{font-size:13px;font-weight:700;color:var(--e);background:var(--el);border-radius:99px;padding:2px 10px}
.day ul{margin:8px 0 0;padding-left:18px}
.day li{margin:5px 0}
.note{font-size:14px;color:var(--mut);margin:0 0 4px}
details{border-top:1px solid var(--line);padding:2px 0}
details:first-of-type{border-top:0}
summary{font-weight:700;padding:12px 0;cursor:pointer;color:var(--g)}
details ul{margin:0 0 12px;padding-left:18px;color:var(--ink)}
details li{margin:4px 0}
.hide{display:none}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.int{margin-left:8px;border:1.5px solid var(--g);background:none;color:var(--g);border-radius:99px;font:700 12px inherit;padding:3px 10px;cursor:pointer;white-space:nowrap}
.int:disabled{background:var(--gl);border-color:transparent;cursor:default}
.row{margin:12px 0}.rt small{display:block;color:var(--mut);font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin-top:4px}.bar i{height:14px;background:var(--g);border-radius:7px;min-width:4px}
footer{text-align:center}.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;font-size:13px;margin-top:20px;cursor:pointer}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cta.sec{background:var(--gl);color:var(--g);margin:0;padding:12px}#bshr{grid-column:1/3}
.sel2{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px inherit;margin-bottom:12px}
.opt{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;background:var(--bg)}.opt h3{font-size:17px;margin-bottom:4px}.opt p{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tg{font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px;color:#fff}
.l0{background:#3F7A45}.l1{background:#8F6B12}.l2{background:#9A5B26}.l3{background:#9C3A2A}.l9{background:var(--mut)}
.rec{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--gl);font-weight:600}
.ch{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:14px}.mc{display:flex;flex-direction:column;align-items:center;border-radius:8px;padding:4px 0}.mc.on{background:var(--el)}
.bs{display:flex;align-items:flex-end;gap:2px;height:56px}.bs i{width:7px;border-radius:3px 3px 0 0;display:block}.bs .a{background:var(--g)}.bs .b{background:var(--e)}.mc small{font-size:11px;color:var(--mut)}
.lgd{font-size:13px;color:var(--mut);margin:8px 0 0}
</style></head><body><svg class="bg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient></defs><rect width="400" height="800" fill="url(#sk)"/><path d="M0 500 L60 430 L120 470 L200 380 L280 460 L350 410 L400 440 L400 800 L0 800Z" fill="var(--m1)"/><path d="M215 590 L245 380 L262 330 L276 300 L292 340 L312 400 L340 590Z" fill="var(--m2)"/><path d="M262 330 L268 420 L258 520M282 320 L290 430" stroke="var(--m3)" stroke-width="3" fill="none" opacity=".6"/><path d="M0 800 L0 590 Q110 560 220 595 L400 640 L400 800Z" fill="var(--m3)"/><g stroke="var(--t)" stroke-width="3" fill="none" opacity=".85"><path d="M0 640 Q120 610 240 640 T400 675"/><path d="M0 665 Q120 635 240 665 T400 700"/><path d="M0 690 Q120 660 240 690 T400 725"/><path d="M0 715 Q120 685 240 715 T400 750"/></g><g fill="var(--r)"><path d="M110 618 h34 v-14 l-17 -10 l-17 10z"/><path d="M155 624 h28 v-12 l-14 -9 l-14 9z"/><path d="M60 632 h30 v-12 l-15 -9 l-15 9z"/><path d="M195 630 h26 v-11 l-13 -8 l-13 8z"/></g></svg><main>
<div class="top"><span class="logo">CuscoPlan</span><div class="lang"><button id="bes">ES</button><button id="ben">EN</button></div></div>
<div id="app"><section class="hero">
<h1 id="h1"></h1><p id="hp"></p>
<svg viewBox="0 0 400 70" aria-hidden="true"><path d="M0 70 L0 52 L60 30 L95 46 L150 12 L205 44 L250 26 L310 50 L350 34 L400 48 L400 70Z" fill="#3F6B43"/><path d="M0 70 L0 60 L80 44 L140 58 L210 38 L290 60 L360 46 L400 58 L400 70Z" fill="#B98A2E" opacity=".85"/></svg>
</section>
<section class="box">
<p class="lbl" id="ld"></p><div class="days" id="days"></div>
<p class="lbl" id="li"></p><div class="chips" id="chips"></div>
<button class="cta" id="go"></button>
</section>
<section id="out" class="hide">
<h2 id="ot" style="margin-top:22px"></h2>
<div id="plan"></div>
<button class="cta wa" id="wa" style="margin-top:16px"></button>
<div class="box" style="margin-top:12px"><p class="lbl" id="sht"></p><div class="acts"><button class="cta sec" id="bpdf"></button><button class="cta sec" id="bimg"></button><button class="cta sec" id="bshr"></button></div><p class="note" id="st" role="status"></p></div>
</section>
<section class="box" id="rt"><h2 id="rth"></h2><label class="lbl" for="ro" id="rlo" style="display:block"></label><select class="sel2" id="ro"></select><label class="lbl" for="rm" id="rlm" style="display:block"></label><select class="sel2" id="rm"></select><div id="rout" aria-live="polite"></div></section>
<section class="box"><h2 id="tt"></h2><div id="tips"></div></section>
</div><section id="hv" class="box hide"></section><footer><button class="lnk" id="hb"></button></footer></main>
<script>

const HOTEL_WA="51999999999";

const HOSTAL_PIN="cusco2026";
const I=[["cul","Historia y cultura","History & culture"],["gas","Gastronomía","Food"],["nat","Naturaleza","Nature"],["adv","Aventura","Adventure"],["rel","Relax","Relax"]];

{t:["Llegada y descanso","Arrival and rest"],a:3400,i:[
[0,"Descansa en el hotel, bebe agua y toma mate de coca. Nada de esfuerzo.","Rest at the hotel, drink water and have coca tea. No effort today."],

{t:["Machu Picchu","Machu Picchu"],a:2400,i:[

const TIPS=[

["Qué llevar","What to bring",[["Ropa en capas: polar, cortaviento y algo ligero.","Layered clothing: fleece, windbreaker and something light."],["Protector solar, lentes y gorro: el sol de altura es fuerte.","Sunscreen, sunglasses and a hat: high-altitude sun is strong."],["Zapatos cómodos con buen agarre para piedra.","Comfortable shoes with good grip on stone."],["Botella reutilizable, poncho de lluvia y mochila pequeña.","Reusable bottle, rain poncho and a small daypack."],["Tu pasaporte para Machu Picchu y tren.","Your passport for Machu Picchu and the train."]]],
["Clima","Weather",[["Mayo a octubre: seco, días soleados y noches muy frías.","May to October: dry, sunny days and very cold nights."],["Noviembre a abril: lluvias, sobre todo por la tarde.","November to April: rainy, mostly in the afternoons."],["En un mismo día puedes pasar de sol a frío: usa capas.","You can go from sun to cold in one day: use layers."]]],
["Seguridad","Safety",[["Usa taxis del hotel o apps; evita paradas al azar de noche.","Use hotel taxis or apps; avoid random pickups at night."],["Cuida bolsos y celular en mercados y calles llenas.","Watch bags and phones in markets and crowded streets."],["Contrata tours con agencias formales y pregunta por seguros.","Book tours with licensed agencies and ask about insurance."],["No aceptes comida o bebidas de desconocidos.","Do not accept food or drinks from strangers."],["Guarda una copia digital de tu pasaporte.","Keep a digital copy of your passport."]]]];
